<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Inventarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <!-- Encabezado con Navegación -->
    <nav class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl">📦</span>
            <span class="font-bold text-base">Consulta de Inventario</span>
        </div>
        <button onclick="toggleAdminView()" class="text-xs bg-blue-900 border border-blue-400 font-semibold px-3 py-1.5 rounded text-white active:bg-blue-700">
            ⚙️ Cargar Excel
        </button>
    </nav>

    <!-- VISTA DE BÚSQUEDA (PARA COMPAÑEROS) -->
    <main class="max-w-md mx-auto p-4 mt-2">
        
        <!-- Logotipo e Introducción -->
        <div class="text-center mb-5">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full mx-auto flex items-center justify-center text-3xl mb-2 shadow-inner">
                🔍
            </div>
            <h2 class="text-lg font-bold text-gray-800">Búsqueda de Materiales</h2>
            <p class="text-xs text-gray-500">Consulta ubicaciones y cantidades en tiempo real</p>
        </div>

        <!-- Formulario de Búsqueda -->
        <div class="bg-white rounded-xl shadow-md p-4 space-y-4 border border-gray-200">
            
            <!-- Selector de Inventario -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Seleccionar Inventario / Trimestre:</label>
                <select id="inventorySelect" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-700 font-medium">
                    <option value="ALL">▼ Todos los Inventarios</option>
                    <option value="INV1">Inventario 1 / Trimestre 1</option>
                    <option value="INV2">Inventario 2 / Trimestre 2</option>
                    <option value="INV3">Inventario 3 / Trimestre 3</option>
                </select>
            </div>

            <!-- Entrada de Búsqueda -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Código del Material:</label>
                <input type="text" id="searchInput" placeholder="Ingresa el código aquí (ej: 1354273)..." class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button onclick="performSearch()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-lg shadow transition">
                🔍 Buscar Material
            </button>
        </div>

        <!-- Contenedor de Resultados -->
        <div id="results" class="mt-5 space-y-3"></div>
    </main>

    <!-- PANEL DE CARGA DE EXCEL -->
    <section id="adminView" class="max-w-md mx-auto p-4 mt-4 hidden">
        <div class="bg-white rounded-xl shadow-lg p-4 border-2 border-blue-500">
            <h3 class="font-bold text-blue-900 text-sm mb-1">📂 Cargar / Actualizar Archivo Excel</h3>
            <p class="text-xs text-gray-500 mb-3">Selecciona el archivo semanal de tu celular:</p>
            
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="block w-full text-xs text-gray-500 border border-gray-300 rounded p-2 mb-3 bg-gray-50">
            
            <button onclick="processExcelUpload()" class="w-full bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2.5 rounded-lg transition shadow">
                ✅ Guardar e Importar Datos
            </button>
        </div>
    </section>

    <script>
        let inventoryData = [];

        // Cargar datos previos si existen
        window.onload = function() {
            const savedData = localStorage.getItem('app_inventory_data');
            if (savedData) {
                inventoryData = JSON.parse(savedData);
            }
        };

        function toggleAdminView() {
            const adminView = document.getElementById('adminView');
            adminView.classList.toggle('hidden');
            if(!adminView.classList.contains('hidden')) {
                adminView.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function processExcelUpload() {
            const fileInput = document.getElementById('excelFileInput');
            if (!fileInput.files.length) {
                alert("Por favor selecciona un archivo de Excel primero.");
                return;
            }

            const reader = new FileReader();
            reader.readAsArrayBuffer(fileInput.files[0]);
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                inventoryData = [];
                
                workbook.SheetNames.forEach(sheetName => {
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonSheet = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                    
                    jsonSheet.forEach(row => {
                        const codigo = String(row['CODIGO'] || row['CODIGO MATERIAL'] || row['MATERIAL'] || row['Material'] || row['Unnamed: 0'] || '').trim();
                        const nombre = String(row['TEXTO BREVE DE MATERIAL'] || row['DESCRIPCION'] || row['DESCRIPCIO'] || row['TEXTO MATERIAL'] || row['TEXTO'] || 'Sin Nombre').trim();
                        const ubicacion = String(row['UBICACION '] || row['UBICACION'] || row['UBICACIÓN ACTUAL'] || row['UBICACIÓN 4TRIM-23'] || row['POSICION'] || 'N/A').trim();
                        const cantidad = row['CANTIDAD'] || row['CONTEO'] || row['FISICO'] || row['CANT'] || row['cont'] || 0;

                        if (codigo && codigo !== 'undefined') {
                            inventoryData.push({
                                sheet: sheetName,
                                codigo: codigo,
                                nombre: nombre,
                                ubicacion: ubicacion,
                                cantidad: cantidad
                            });
                        }
                    });
                });

                localStorage.setItem('app_inventory_data', JSON.stringify(inventoryData));
                alert(`¡Éxito! Se importaron ${inventoryData.length} registros del Excel.`);
                document.getElementById('adminView').classList.add('hidden');
            };
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const filter = document.getElementById('inventorySelect').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (inventoryData.length === 0) {
                resultsDiv.innerHTML = `<div class="p-4 bg-amber-50 text-amber-800 text-xs rounded-lg text-center font-medium border border-amber-200">Aún no hay datos cargados. Toca arriba en "⚙️ Cargar Excel" para importar el archivo.</div>`;
                return;
            }

            if (!query) {
                resultsDiv.innerHTML = `<div class="p-4 bg-blue-50 text-blue-700 text-xs rounded-lg text-center border border-blue-200">Ingresa un código para realizar la búsqueda.</div>`;
                return;
            }

            const matches = inventoryData.filter(item => {
                const matchCode = item.codigo.toLowerCase().includes(query) || item.nombre.toLowerCase().includes(query);
                
                let matchFilter = true;
                if (filter === 'INV1') matchFilter = item.sheet.toLowerCase().includes('1');
                else if (filter === 'INV2') matchFilter = item.sheet.toLowerCase().includes('2');
                else if (filter === 'INV3') matchFilter = item.sheet.toLowerCase().includes('3');

                return matchCode && matchFilter;
            });

            if (matches.length === 0) {
                resultsDiv.innerHTML = `<div class="p-4 bg-gray-100 text-gray-600 text-xs rounded-lg text-center">No se encontraron resultados para el código ingresado.</div>`;
                return;
            }

            matches.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-left space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-100">${item.sheet}</span>
                        <span class="text-xs text-gray-500 font-mono font-semibold">Cód: ${item.codigo}</span>
                    </div>
                    <div>
                        <p class="text-[11px] text-gray-400 font-semibold uppercase tracking-wider">Nombre del Material</p>
                        <p class="text-sm font-bold text-gray-800">${item.nombre}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-2 border-t text-xs">
                        <div>
                            <span class="text-gray-500 block">Ubicación:</span>
                            <span class="font-bold text-gray-800">${item.ubicacion}</span>
                        </div>
                        <div>
                            <span class="text-gray-500 block">Cantidad:</span>
                            <span class="font-bold text-green-600">${item.cantidad}</span>
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });
        }
    </script>
</body>
  </html>
